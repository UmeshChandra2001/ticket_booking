services:

  movies:
    container_name: moviescont
    build:
      context: ./movies
      dockerfile: dockerfile
    ports:
      - "9980:80"
    networks:
      - booking_network
    environment:
      APP_NAME: movies
      APP_ENV: production
      PORT: 80
    volumes:
      - movies_data:/app/data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  bus:
    container_name: buscont
    build:
      context: ./bus
      dockerfile: dockerfile
    ports:
      - "9981:80"
    networks:
      - booking_network
    environment:
      APP_NAME: bus
      APP_ENV: production
      PORT: 80
    volumes:
      - bus_data:/app/data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  flight:
    container_name: flightcont
    build:
      context: ./flight
      dockerfile: dockerfile
    ports:
      - "9982:80"
    networks:
      - booking_network
    environment:
      APP_NAME: flight
      APP_ENV: production
      PORT: 80
    volumes:
      - flight_data:/app/data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  train:
    container_name: traincont
    build:
      context: ./train
      dockerfile: dockerfile
    ports:
      - "9983:80"
    networks:
      - booking_network
    environment:
      APP_NAME: train
      APP_ENV: production
      PORT: 80
    volumes:
      - train_data:/app/data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

networks:
  booking_network:
    driver: bridge

volumes:
  train_data:
  movies_data:
  bus_data:
  flight_data:
